[workspace]
members = [
    "programs/cypherlink",
    "sdk",
    "prover-node",
    "shared/types",
    "shared/crypto",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZyberLink Team"]

[workspace.dependencies]
# Solana (stable 2.1.x - compatible with Light Protocol)
solana-program = "2.1"
solana-sdk = "2.1"
solana-client = "2.1"

# Serialization
borsh = { version = "1.5.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.47", features = ["full"] }

# Cryptography
ml-kem = "0.2.1"
aes-gcm = "0.10"
sha3 = "0.10"
ed25519-dalek = "2.1"
rand = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
solana-program-test = "2.1"

# Light Protocol (ZK Compression)
light-sdk = "0.13.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
