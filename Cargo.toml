[workspace]
members = [
    "sdk",
    "prover-node",
    "witness-storage",
    "blink-server",
    "shared/types",
    "shared/crypto",
    # Temporarily excluded due to zeroize version conflict with programs workspace
    # "e2e-tests",
    "fhe-cli",
    "test-utils",
]
exclude = [
    "job-creator",  # Standalone E2E testing tool
]
resolver = "2"

# Note: programs/ has its own separate workspace for Solana BPF compilation
# See programs/Cargo.toml

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZyberLink Team"]

[workspace.dependencies]
# Shared types
cypherlink-types = { path = "shared/types" }

# Solana (updated to 2.3.x for better compatibility)
solana-program = "2.3"
solana-sdk = "2.3"
solana-client = "2.3"
solana-account-decoder = "2.3"

# SPL Token
spl-token = "6.0"
spl-associated-token-account = "4.0"

# Serialization
borsh = { version = "1.5.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.47", features = ["full"] }

# Cryptography
ml-kem = "0.2.1"
aes-gcm = "0.10"
sha3 = "0.10"
ed25519-dalek = "2.1"
rand = "0.8"
hex = "0.4"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
solana-program-test = "2.3"

# TODO: Re-enable for zkCompression integration (https://www.zkcompression.com/)
# When adding back light-sdk, also add getrandom patch:
# [patch.crates-io]
# getrandom = { git = "https://github.com/solana-labs/getrandom", rev = "..." }
# light-sdk = "0.13.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

