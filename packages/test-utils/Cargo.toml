[package]
name = "test-utils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-tfhe-keys"
path = "src/bin/generate_tfhe_keys.rs"

[[bin]]
name = "sign-message"
path = "src/bin/sign_message.rs"

[dependencies]
tfhe = { version = "0.10", default-features = false, features = ["integer", "x86_64-unix"] }
bincode = "1.3"
base64 = "0.22"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
solana-sdk = "2.1"
serde_json = "1.0"
