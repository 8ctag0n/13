[workspace]
members = [
    "cypherlink",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZyberLink Team"]

[workspace.dependencies]
# Solana (for BPF programs)
solana-program = "2.1"
borsh = { version = "1.5.7", features = ["derive"] }
thiserror = "1.0"

# Shared types (using relative path outside workspace)
cypherlink-types = { path = "../shared/types" }

# Testing
solana-program-test = "2.1"
solana-sdk = "2.1"
tokio = { version = "1.47", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
