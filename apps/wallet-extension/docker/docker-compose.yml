# ZyberLink Wallet - Local Test Environment
# Levanta los 3 nodos para pruebas locales

services:
  # ============================================
  # SOLANA - Local Validator
  # ============================================
  solana:
    image: solanalabs/solana:v1.18.22
    container_name: zyberlink-solana
    ports:
      - "8899:8899"   # RPC
      - "8900:8900"   # RPC WebSocket
      - "9900:9900"   # Faucet
    command: >
      solana-test-validator
      --reset
      --rpc-port 8899
      --faucet-port 9900
      --bind-address 0.0.0.0
      --rpc-bind-address 0.0.0.0
      --log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # STARKNET - Katana (Local Devnet)
  # ============================================
  starknet:
    image: ghcr.io/dojoengine/katana:latest
    container_name: zyberlink-starknet
    ports:
      - "5050:5050"   # RPC
    command: >
      --host 0.0.0.0
      --port 5050
      --accounts 3
      --seed 0
      --gas-price 1
      --invoke-max-steps 4000000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # ZCASH - Regtest Node
  # ============================================
  zcash:
    image: electriccoinco/zcashd:latest
    container_name: zyberlink-zcash
    ports:
      - "18232:18232"  # RPC
    environment:
      - ZCASHD_NETWORK=regtest
      - ZCASHD_GEN=1
    volumes:
      - zcash-data:/root/.zcash
      - ./zcash.conf:/root/.zcash/zcash.conf:ro
    command: >
      -regtest
      -server=1
      -rpcuser=zyberlink
      -rpcpassword=testpass123
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -gen=1
      -genproclimit=1
      -equihashsolver=tromp
    healthcheck:
      test: ["CMD", "zcash-cli", "-regtest", "-rpcuser=zyberlink", "-rpcpassword=testpass123", "getblockchaininfo"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  zcash-data:

networks:
  default:
    name: zyberlink-testnet
