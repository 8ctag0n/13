# ZyberLink Devnet - NGINX Configuration
# Domain: demo.zyberlink.fun (ajustar según tu dominio)
# Backend: localhost:7777
# Frontend: servido desde el container webapp o directamente

# ===========================================
# Rate Limiting Zones
# ===========================================
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=provers:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=jobs_create:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ===========================================
# Upstreams
# ===========================================
upstream backend {
    server localhost:7777;
    keepalive 64;
}

# Si el frontend corre en otro puerto (ej: 3000), descomentar:
# upstream webapp {
#     server localhost:3000;
#     keepalive 32;
# }

# ===========================================
# WebSocket upgrade map
# ===========================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ===========================================
# HTTP -> HTTPS Redirect
# ===========================================
server {
    listen 80;
    listen [::]:80;
    server_name demo.zyberlink.fun;  # CAMBIAR a tu dominio

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ===========================================
# HTTPS Server - Principal
# ===========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.zyberlink.fun;  # CAMBIAR a tu dominio

    # ===========================================
    # SSL Configuration (Let's Encrypt)
    # ===========================================
    ssl_certificate /etc/letsencrypt/live/demo.zyberlink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.zyberlink.fun/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/demo.zyberlink.fun/chain.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ===========================================
    # Security Headers
    # ===========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===========================================
    # Limits & Timeouts
    # ===========================================
    client_max_body_size 150M;          # FHE server keys can be ~120MB
    client_body_buffer_size 1M;
    client_body_timeout 120s;
    client_header_timeout 30s;
    send_timeout 120s;
    keepalive_timeout 65;

    server_tokens off;
    limit_conn conn_limit 20;

    # ===========================================
    # Logging
    # ===========================================
    access_log /var/log/nginx/zyberlink.access.log;
    error_log /var/log/nginx/zyberlink.error.log warn;

    # ===========================================
    # Health Check (no rate limit)
    # ===========================================
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ===========================================
    # API Routes -> Backend
    # ===========================================

    # Job creation (POST) - strict rate limit
    location = /api/jobs {
        limit_req zone=jobs_create burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Prover endpoints - high rate limit
    location ~ ^/api/jobs/[^/]+/(witness|claim|result) {
        limit_req zone=provers burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Prover registration/status
    location /api/provers {
        limit_req zone=provers burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Witness upload - large payloads
    location /witness {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # FHE uploads are large and slow
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # FHE result upload
    location /fhe-result {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # General API endpoints
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ===========================================
    # Frontend (SPA) - Static Files
    # ===========================================
    # Option 1: Serve built files directly from disk
    root /var/www/zyberlink;  # AJUSTAR a donde copies el build de webapp

    location / {
        limit_req zone=general burst=20 nodelay;

        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Option 2: Proxy to webapp container (comment root and uncomment this)
    # location / {
    #     limit_req zone=general burst=20 nodelay;
    #     proxy_pass http://webapp;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    # }

    # ===========================================
    # Security: Block common attacks
    # ===========================================
    location ~* (\.php|\.asp|\.aspx|\.jsp|\.cgi)$ {
        return 444;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Block sensitive paths
    location ~* /(\.git|\.env|\.htaccess|\.htpasswd|wp-admin|wp-login|phpmyadmin) {
        return 444;
    }
}
