# ZyberLink - NGINX Externo (Server)
# Proxy hacia el nginx interno del docker-compose en puerto 9000
# Dominio: demo.zyberlink.fun

# Upstream - NGINX interno del container
upstream zyberlink_internal {
    server localhost:9001;
    keepalive 64;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name demo.zyberlink.fun;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.zyberlink.fun;

    # ===========================================
    # SSL Configuration (Let's Encrypt)
    # ===========================================
    ssl_certificate /etc/letsencrypt/live/demo.zyberlink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.zyberlink.fun/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/demo.zyberlink.fun/chain.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ===========================================
    # Security Headers
    # ===========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===========================================
    # Limits
    # ===========================================
    client_max_body_size 150M;
    server_tokens off;

    # ===========================================
    # Logging
    # ===========================================
    access_log /var/log/nginx/zyberlink.access.log;
    error_log /var/log/nginx/zyberlink.error.log warn;

    # ===========================================
    # Proxy to Internal NGINX (port 9000)
    # ===========================================
    location / {
        proxy_pass http://zyberlink_internal;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts (largos para FHE uploads ~120MB)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering off para uploads grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ===========================================
    # Security: Block common attacks
    # ===========================================
    location ~* /(\.git|\.env|\.htaccess|wp-admin|wp-login|phpmyadmin) {
        return 444;
    }
}
