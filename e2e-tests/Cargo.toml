[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"

[lib]
# No lib, only tests
path = "src/lib.rs"

[dependencies]
# Core dependencies for tests
prover_node = { package = "cypherlink-prover", path = "../prover-node" }
witness_storage = { package = "cypherlink-witness-storage", path = "../witness-storage" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
borsh = "1.5"

# HTTP client for integration tests
reqwest = "0.12"

# Blake2 for commitment verification
blake2 = "0.10"

# Hex encoding
hex = "0.4"

# Axum for TestBackend
axum = "0.7"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solana SDK for test orchestration (match version with program)
solana-sdk = "2.1"
solana-client = "2.1"
cypherlink-types = { path = "../shared/types" }
cypherlink-sdk = { path = "../sdk" }
