[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"

[lib]
# No lib, only tests
path = "src/lib.rs"

[dependencies]
# Core dependencies for tests
prover_node = { package = "zyberlink-prover", path = "../../src/prover-node" }
witness_storage = { package = "zyberlink-witness-storage", path = "../../src/witness-storage" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
borsh = "1.5"

# HTTP client for integration tests
reqwest = "0.12"

# Blake2 for commitment verification
blake2 = "0.10"

# Hex encoding
hex = "0.4"

# Axum for TestBackend
axum = "0.7"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solana SDK for test orchestration (match version with program)
solana-sdk = "2.1"
solana-client = "2.1"
solana-program-test = "2.1"
solana-program = "2.1"
zyberlink-types = { path = "../../src/shared/types" }
zyberlink-sdk = { path = "../../src/sdk" }
zyberlink = { path = "../../src/programs/zyberlink" }

# FHE dependencies for testing
tfhe = { version = "0.10", features = ["integer", "x86_64-unix"] }
sha3 = "0.10"
bincode = "1.3"
