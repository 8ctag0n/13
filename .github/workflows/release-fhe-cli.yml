name: Release FHE-CLI

on:
  push:
    tags:
      - 'fhe-cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fhe-cli
            asset_name: fhe-cli-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fhe-cli
            asset_name: fhe-cli-darwin-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fhe-cli
            asset_name: fhe-cli-darwin-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --package fhe-cli --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/fhe-cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: fhe-cli-v${{ steps.version.outputs.version }}
          name: FHE-CLI v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/fhe-cli-linux-x86_64/fhe-cli-linux-x86_64
            artifacts/fhe-cli-darwin-x86_64/fhe-cli-darwin-x86_64
            artifacts/fhe-cli-darwin-aarch64/fhe-cli-darwin-aarch64
          body: |
            ## FHE-CLI v${{ steps.version.outputs.version }}

            Command-line tool for encrypting data for ZyberLink FHE jobs.

            ### Download

            | Platform | Download |
            |----------|----------|
            | Linux (x86_64) | [fhe-cli-linux-x86_64](https://github.com/${{ github.repository }}/releases/download/fhe-cli-v${{ steps.version.outputs.version }}/fhe-cli-linux-x86_64) |
            | macOS (Intel) | [fhe-cli-darwin-x86_64](https://github.com/${{ github.repository }}/releases/download/fhe-cli-v${{ steps.version.outputs.version }}/fhe-cli-darwin-x86_64) |
            | macOS (Apple Silicon) | [fhe-cli-darwin-aarch64](https://github.com/${{ github.repository }}/releases/download/fhe-cli-v${{ steps.version.outputs.version }}/fhe-cli-darwin-aarch64) |

            ### Installation

            ```bash
            # Download for your platform
            curl -L -o fhe-cli https://github.com/${{ github.repository }}/releases/download/fhe-cli-v${{ steps.version.outputs.version }}/fhe-cli-<PLATFORM>
            chmod +x fhe-cli

            # Move to PATH (optional)
            sudo mv fhe-cli /usr/local/bin/
            ```

            ### Usage

            ```bash
            # Encrypt a single value
            fhe-cli encrypt -v 42

            # Encrypt multiple values (for sum/average operations)
            fhe-cli encrypt --values 10,20,30,40,50

            # Output files will be in ./fhe-output/
            # Upload witness.bin to the ZyberLink webapp
            ```
