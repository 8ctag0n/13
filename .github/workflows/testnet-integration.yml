# Testnet Integration Tests
# Tests completos con Solana, Starknet y Zcash locales
#
name: Testnet Integration

on:
  push:
    branches: [main]
    paths:
      - 'src/wallet-extension/**'
  workflow_dispatch:  # Manual trigger

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wallet-extension

    services:
      solana:
        image: solanalabs/solana:v1.18.22
        ports:
          - 8899:8899
          - 9900:9900
        options: >-
          --health-cmd "curl -f http://localhost:8899/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wallet-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build extension
        run: npm run build

      - name: Wait for Solana
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8899/health && break
            echo "Waiting for Solana..."
            sleep 2
          done

      - name: Run testnet integration tests
        run: xvfb-run npm test -- testnet-integration.spec.ts --reporter=github
        env:
          SOLANA_RPC_URL: http://localhost:8899

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-test-results
          path: |
            src/wallet-extension/test-results/
            src/wallet-extension/playwright-report/
          retention-days: 7
