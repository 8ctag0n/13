name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-prover:
    name: Build Prover Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build prover-node
        run: |
          cargo build --release -p zyberlink-prover

      - name: Create release directory
        run: |
          mkdir -p release/prover-node
          cp target/release/zyberlink-prover release/prover-node/
          cp releases/prover-node-v0.1.0/README.md release/prover-node/

      - name: Create tarball
        run: |
          cd release
          tar -czf prover-node-linux-x64.tar.gz prover-node/
          sha256sum prover-node-linux-x64.tar.gz > prover-node-linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: prover-node-linux-x64
          path: release/prover-node-linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/prover-node-linux-x64.tar.gz
            release/prover-node-linux-x64.tar.gz.sha256
          body: |
            ## ZyberLink Prover Node Release

            ### Installation

            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/prover-node-linux-x64.tar.gz
            tar -xzf prover-node-linux-x64.tar.gz
            cd prover-node
            chmod +x zyberlink-prover
            ./zyberlink-prover --help
            ```

            ### Verify Checksum

            ```bash
            sha256sum -c prover-node-linux-x64.tar.gz.sha256
            ```

            ### What's Included

            - `zyberlink-prover` - Prover node binary
            - `README.md` - Setup and usage instructions

            ### System Requirements

            - Linux x86_64
            - 4GB+ RAM
            - Solana RPC access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    name: Build Backend Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zyberlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zyberlink
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build backend
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,runtime-tokio-native-tls
          (cd src/blink-server && sqlx database create && sqlx migrate run)
          cargo build --release -p zyberlink-blink-server

      - name: Create release directory
        run: |
          mkdir -p release/backend
          cp target/release/blink-server release/backend/
          echo "# ZyberLink Backend Server" > release/backend/README.md

      - name: Create tarball
        run: |
          cd release
          tar -czf backend-linux-x64.tar.gz backend/
          sha256sum backend-linux-x64.tar.gz > backend-linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-linux-x64
          path: release/backend-linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/backend-linux-x64.tar.gz
            release/backend-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
