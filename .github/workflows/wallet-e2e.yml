# Wallet Extension E2E Tests
# Tests básicos de UI - corren en cada PR
#
name: Wallet E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/wallet-extension/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/wallet-extension/**'

jobs:
  wallet-tests:
    name: Wallet UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wallet-extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wallet-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build extension
        run: npm run build

      - name: Run wallet tests
        run: xvfb-run npm test -- wallet.spec.ts --reporter=github

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-test-results
          path: |
            src/wallet-extension/test-results/
            src/wallet-extension/playwright-report/
          retention-days: 7
