# Zcash Shielded Tests
# Tests específicos de transacciones shielded
# Se corre manualmente o en releases
#
name: Zcash Shielded

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [created]

jobs:
  zcash-tests:
    name: Zcash Shielded Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wallet-extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wallet-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build extension
        run: npm run build

      - name: Start Zcash regtest
        run: |
          docker run -d --name zcash-regtest \
            -p 18232:18232 \
            -v ${{ github.workspace }}/src/wallet-extension/docker/zcash.conf:/root/.zcash/zcash.conf:ro \
            electriccoinco/zcashd:latest \
            -regtest -server=1 \
            -rpcuser=zyberlink -rpcpassword=testpass123 \
            -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0

      - name: Wait for Zcash
        run: |
          echo "Waiting for Zcash to start..."
          for i in {1..60}; do
            if docker exec zcash-regtest zcash-cli -regtest -rpcuser=zyberlink -rpcpassword=testpass123 getblockchaininfo 2>/dev/null; then
              echo "Zcash is ready!"
              break
            fi
            echo "Attempt $i/60..."
            sleep 5
          done

      - name: Generate initial blocks
        run: |
          docker exec zcash-regtest zcash-cli -regtest \
            -rpcuser=zyberlink -rpcpassword=testpass123 \
            generate 110 || true

      - name: Run Zcash shielded tests
        run: xvfb-run npm test -- zcash-shielded.spec.ts --reporter=github
        env:
          ZCASH_RPC_URL: http://localhost:18232

      - name: Cleanup
        if: always()
        run: docker rm -f zcash-regtest || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zcash-test-results
          path: |
            src/wallet-extension/test-results/
            src/wallet-extension/playwright-report/
          retention-days: 7
