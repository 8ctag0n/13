# Build & Package Wallet Extension
# Cuando los tests pasan en main → genera el paquete .zip
#
name: Build & Package

on:
  push:
    branches: [main]
    paths:
      - 'src/wallet-extension/**'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.2.0)'
        required: false
        default: ''

jobs:
  # Primero correr tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wallet-extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wallet-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Build extension
        run: npm run build

      - name: Run tests
        run: xvfb-run npm test -- wallet.spec.ts --reporter=github

  # Si tests pasan, generar paquete
  package:
    name: Package Extension
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wallet-extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wallet-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Package extension
        run: |
          cd dist
          zip -r ../zyberlink-wallet-v${{ steps.version.outputs.version }}.zip .
          cd ..

          # Calcular checksums
          sha256sum zyberlink-wallet-v${{ steps.version.outputs.version }}.zip > checksums.txt

          echo "Package created:"
          ls -lh zyberlink-wallet-*.zip
          cat checksums.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyberlink-wallet-v${{ steps.version.outputs.version }}
          path: |
            src/wallet-extension/zyberlink-wallet-*.zip
            src/wallet-extension/checksums.txt
          retention-days: 90

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src/wallet-extension/zyberlink-wallet-*.zip
            src/wallet-extension/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notificar resultado
  notify:
    name: Summary
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Package ready
        run: |
          echo "## ZyberLink Wallet Package Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Extension packaged successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Actions > Artifacts**" >> $GITHUB_STEP_SUMMARY
