[package]
name = "cypherlink-witness-storage"
version = "0.1.0"
edition = "2021"

[lib]
name = "witness_storage"
path = "src/lib.rs"

[[bin]]
name = "witness-storage"
path = "src/main.rs"

[features]
default = ["persistence"]
persistence = []

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10"
hex = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tower = "0.5"

[dev-dependencies]
tempfile = "3"
