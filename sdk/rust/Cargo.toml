[package]
name = "zyberlink-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
solana-sdk.workspace = true
solana-client.workspace = true
solana-account-decoder.workspace = true
borsh.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake2 = "0.10"

# ZK / Arkworks
ark-ff = { version = "0.4", default-features = false, features = ["std"] }
ark-ec = { version = "0.4", default-features = false, features = ["std"] }
ark-serialize = { version = "0.4", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.4", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.4", default-features = false, features = ["std"] }
ark-snark = { version = "0.4", default-features = false }
ark-relations = { version = "0.4", default-features = false, features = ["std"] }
ark-std = { version = "0.4", default-features = false, features = ["std"] }
ark-sponge = { version = "0.4.0-alpha", default-features = false, features = ["std"] }
serde_json.workspace = true

# High-level client dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { workspace = true, features = ["json"] }
hex.workspace = true
base64 = "0.21"
dirs = "5.0"
bincode = "1.3"

# Logging
log.workspace = true
env_logger.workspace = true

# ZyberLink crates
zyberlink-types = { path = "../../kernel/types" }
zyberlink-fhe = { path = "../../kernel/fhe" }
bedrock-sdk = { path = "../../programs/sdks/bedrock-sdk" }

# Re-export tfhe types
tfhe = { version = "0.10", default-features = false, features = ["integer", "x86_64-unix"] }

[dev-dependencies]
solana-program-test.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
zyberlink = { path = "../../src/programs/zyberlink", features = ["no-entrypoint"] }
reqwest.workspace = true
hex.workspace = true
serde_json.workspace = true
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
rand.workspace = true
