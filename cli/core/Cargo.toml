[package]
name = "zyb-cli"
version = "0.1.0"
edition = "2021"
authors = ["ZyberLink Team"]
description = "Unified CLI for ZyberLink FHE and ZK operations"

[[bin]]
name = "zyb"
path = "src/main.rs"

[dependencies]
# ZyberLink
zyberlink-sdk = { path = "../../sdk/rust" }
zyberlink-types = { path = "../../kernel/types" }
zyberlink-fhe = { path = "../../kernel/fhe" }
fhe-generator-sdk = { path = "../../src/programs/sdks/fhe-generator-sdk" }
futarchy-sdk = { path = "../../verticals/governance/sdk/rust" }
zyberlink-chain-client = { path = "../../packages/chain-client", optional = true }

# FHE
tfhe = { version = "0.10", features = ["integer", "x86_64-unix"] }

# Serialization
bincode = "1.3"
base64 = "0.22"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
borsh = "1.5"

# Crypto
sha3 = "0.10"
blake2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
light-poseidon = "0.2"  # Compatible with circomlib Poseidon
ark-bn254 = "0.4"       # BN254 curve for Poseidon (must match light-poseidon)

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI utilities
colored = "2.1"
atty = "0.2"
clap = { version = "4.4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
console = "0.15"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
bs58 = "0.5"

# File I/O
dirs = "5.0"
shellexpand = "3.1"

# HTTP client (for ZK commands)
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.47", features = ["full"] }
comfy-table = "7.1"
indicatif = "0.17"

# Solana
solana-sdk = "2.3"
solana-client = "2.3"

# Async trait for chain abstraction
async-trait = "0.1"

[features]
default = []
starknet = ["zyberlink-chain-client", "zyberlink-chain-client/starknet"]

[lib]
path = "src/lib.rs"
