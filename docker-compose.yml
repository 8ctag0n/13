# ZyberLink Docker Compose - 3-Layer Architecture
# ================================================
# Arquitectura de 3 capas con load balancing:
#   public-api:3000 (expuesto) -> x402:8081 (interno) -> blink:8080 (interno)

services:
  # ============================================
  # Solana Test Validator
  # ============================================
  validator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.validator
    ports:
      - "8899:8899"
      - "8900:8900"
    volumes:
      - validator_ledger:/ledger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=zyberlink
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev_password}
      - POSTGRES_DB=zyberlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyberlink"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Layer 3: Blink Server (Internal Backend)
  # NO expuesto a internet
  # ============================================
  blink:
    build:
      context: .
      dockerfile: src/blink-server/Dockerfile
    deploy:
      replicas: 2
    expose:
      - "8080"
    volumes:
      - /tmp/backend-keypair.json:/app/keypair.json:ro
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://zyberlink:${DB_PASSWORD:-dev_password}@postgres:5432/zyberlink
      - SOLANA_RPC_URL=http://validator:8899
      - PROGRAM_ID=${PROGRAM_ID:-11111111111111111111111111111111}
      - HOST=0.0.0.0
      - PORT=8080
      - SERVER_KEYPAIR_PATH=/app/keypair.json
      - X402_URL=http://x402:8081
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================
  # Layer 2: X402 Anti-Spam Gateway
  # NO expuesto a internet
  # ============================================
  x402:
    build:
      context: .
      dockerfile: src/x402-server/Dockerfile
    deploy:
      replicas: 2
    expose:
      - "8081"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://zyberlink:${DB_PASSWORD:-dev_password}@postgres:5432/zyberlink
      - BLINK_URL=http://blink:8080
      - HOST=0.0.0.0
      - PORT=8081
    depends_on:
      blink:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # Layer 1: Public API Gateway (ENTRY POINT)
  # UNICO servicio expuesto a internet
  # ============================================
  public-api:
    build:
      context: .
      dockerfile: src/public-api/Dockerfile
    deploy:
      replicas: 2
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - X402_URL=http://x402:8081
      - BLINK_URL=http://blink:8080
      - HOST=0.0.0.0
      - PORT=3000
      - RATE_LIMIT_PER_MIN=100
    depends_on:
      x402:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # NGINX Load Balancer (optional)
  # ============================================
  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
      - public-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - with-nginx

  # ============================================
  # Frontend (Svelte)
  # ============================================
  webapp:
    build:
      context: ./src/webapp
      args:
        VITE_API_URL: ""
        VITE_SOLANA_RPC_URL: "http://localhost:8899"
    deploy:
      replicas: 2
    expose:
      - "80"
    restart: unless-stopped
    profiles:
      - with-frontend

volumes:
  postgres_data:
  validator_ledger:

# Para escalar manualmente:
# podman-compose up --scale blink=4 --scale x402=3 --scale public-api=3
