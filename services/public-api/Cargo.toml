[package]
name = "public-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
governor = "0.6"
log = "0.4"
env_logger = "0.10"
solana-sdk = "2.3"
solana-client = "2.3"
solana-transaction-status = "2.3"
anyhow = "1.0"
hex = "0.4"
