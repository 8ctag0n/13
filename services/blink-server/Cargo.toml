[package]
name = "zyberlink-blink-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "blink-server"
path = "src/main.rs"

[[bin]]
name = "callback-executor"
path = "src/bin/callback_executor.rs"

[dependencies]
# Web framework
actix-web = "4.5"
actix-cors = "0.7"

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

# Solana
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-account-decoder = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Encoding
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"

# FHE (Fully Homomorphic Encryption)
tfhe = { version = "0.10", default-features = false, features = ["integer", "x86_64-unix"] }

# Hashing
sha3 = "0.10"
blake2 = "0.10"
hex = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }

# UUID for x402 tokens
uuid = { version = "1.10", features = ["v4"] }

# SDK and types
zyberlink-sdk = { path = "../../sdk/rust" }
zyberlink-types = { path = "../../kernel/types" }
zyberlink-chain-client = { workspace = true, features = ["solana", "starknet"] }
futarchy-sdk = { path = "../../verticals/governance/sdk/rust" }
borsh = { workspace = true }

# HTTP client for x402-server communication
reqwest = { workspace = true }

# Zero-knowledge proof verification (Groth16 with arkworks)
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-snark = "0.4"
num-bigint = "0.4"

[dev-dependencies]
