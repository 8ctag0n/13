[package]
name = "zyberlink-fhe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FHE (Fully Homomorphic Encryption) engine for ZyberLink"

[dependencies]
# Shared types (re-export FhePredicate, FheOperation, etc.)
zyberlink-types = { path = "../types" }

# FHE library
tfhe = { version = "0.10", features = ["integer", "x86_64-unix"] }

# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Hashing
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros"] }

[features]
default = []
# Enable WASM compilation (for browser SDKs)
wasm = []
