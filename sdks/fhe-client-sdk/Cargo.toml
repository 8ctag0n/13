[package]
name = "fhe-client-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Futarchy Team"]
description = "Client SDK for FHE encryption of bet amounts in Futarchy Markets"
license = "MIT"

[workspace]
# Standalone package - not part of main workspace

[dependencies]
tfhe = { version = "0.7", features = ["shortint", "boolean", "integer", "seeder_unix"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"

[features]
default = []
# Para reducir tamaño en WASM
wasm = []
