[package]
name = "zyberlink-unified-sdk"
version = "0.1.0"
edition = "2021"
authors = ["ZyberLink Team"]
description = "Unified SDK for all ZyberLink programs (Bedrock, FHE-Generator, ZK-Generator, Futarchy)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zyberlink/wt-infra"

[lib]
name = "zyberlink_unified_sdk"
path = "src/lib.rs"

[features]
default = ["bedrock", "zk", "fhe", "futarchy"]
bedrock = []
zk = []
fhe = []
futarchy = []
prover = []  # Prover-specific utilities
full = ["bedrock", "zk", "fhe", "futarchy", "prover"]

[dependencies]
# Solana
solana-sdk.workspace = true
solana-client.workspace = true
solana-account-decoder.workspace = true
borsh.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { workspace = true, features = ["json"] }

# Errors
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# Logging
log.workspace = true

# Time
chrono = "0.4"

# Shared libraries (core dependencies)
zyberlink-jobs = { path = "../../src/shared/jobs" }
zyberlink-types = { path = "../../kernel/types" }

# TODO: Add when programs have no-entrypoint features
# bedrock = { path = "../../src/programs/bedrock", features = ["no-entrypoint"], optional = true }
# fhe-generator = { path = "../../src/programs/fhe-generator", features = ["no-entrypoint"], optional = true }
# zk-generator = { path = "../../src/programs/zk-generator", features = ["no-entrypoint"], optional = true }
# futarchy-markets = { path = "../../src/programs/futarchy-markets", features = ["no-entrypoint"], optional = true }

[dev-dependencies]
env_logger.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "query_jobs"
path = "examples/query_jobs.rs"
