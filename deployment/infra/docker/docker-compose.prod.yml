version: '3.8'

# ZyberLink Production Stack
# ==========================
# Stack optimizado para hosting/produccion.
# Frontend servido con nginx, backend compilado.
#
# Requisitos:
#   - Solana RPC (puede ser devnet/mainnet o localnet en host)
#   - Program deployado en la red elegida
#
# Uso:
#   docker-compose -f docker-compose.prod.yml up -d --build
#   docker-compose -f docker-compose.prod.yml down
#   docker-compose -f docker-compose.prod.yml logs -f

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: zyberlink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zyberlink}
      POSTGRES_USER: ${POSTGRES_USER:-zyberlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zyberlink} -d ${POSTGRES_DB:-zyberlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zyberlink-internal
    # No exponer puerto en produccion, solo acceso interno

  # ============================================================================
  # Backend API Server
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zyberlink-api
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zyberlink}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-zyberlink}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      PROGRAM_ID: ${PROGRAM_ID:-CypherLinkProgram11111111111111111111111111}
      PORT: 8080
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - zyberlink-internal
    # No exponer puerto directamente, nginx hace proxy

  # ============================================================================
  # Frontend + Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./webapp
      dockerfile: Dockerfile.prod
    container_name: zyberlink-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_PORT_SSL:-443}:443"
    depends_on:
      - backend
    volumes:
      # Montar certificados SSL si los tenes
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - zyberlink-internal
    environment:
      - API_URL=http://backend:8080
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}

networks:
  zyberlink-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
