[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program.workspace = true
solana-sdk.workspace = true
solana-program-test.workspace = true
solana-client.workspace = true
borsh.workspace = true
tokio.workspace = true

# Los programas (para cargar en tests con simulador)
bedrock = { path = "../bedrock" }
zk-generator = { path = "../zk-generator" }
fhe-generator = { path = "../fhe-generator" }

# Los SDKs (para construir instrucciones)
bedrock-sdk = { path = "../sdks/bedrock-sdk" }
zk-generator-sdk = { path = "../sdks/zk-generator-sdk" }
fhe-generator-sdk = { path = "../sdks/fhe-generator-sdk" }

# Shared types
zyberlink-types = { path = "../../shared/types" }
zyberlink-jobs = { path = "../../shared/jobs" }

# Para tests reales contra localhost
anyhow = "1.0"
sha2 = "0.10"
bincode = "1.3"
