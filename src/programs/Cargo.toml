[workspace]
members = [
    "zyberlink",  # DEPRECATED - will be removed after migration
    "bedrock",
    "zk-generator",
    "fhe-generator",
    "threshold",
    "futarchy-markets",
    "sdks/bedrock-sdk",
    "sdks/fhe-generator-sdk",
    "sdks/zk-generator-sdk",
    "e2e",  # E2E integration tests
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZyberLink Team"]

[workspace.dependencies]
# Solana (for BPF programs - updated to 2.3.x)
solana-program = "2.3"
borsh = { version = "1.5.7", features = ["derive"] }
thiserror = "1.0"
# NOTE: spl-token removed - not used in on-chain program

# Shared libraries (using relative path outside workspace)
zyberlink-types = { path = "../../kernel/types" }
zyberlink-jobs = { path = "../../packages/jobs" }

# Internal programs (for CPI)
bedrock = { path = "bedrock", features = ["no-entrypoint"] }

# Testing
solana-program-test = "2.3"
solana-sdk = "2.3"
solana-client = "2.3"
tokio = { version = "1.47", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
