[package]
name = "job-creator"
version = "0.1.0"
edition = "2021"

[dependencies]
zyberlink-sdk = { path = "../sdk" }
zyberlink-types = { path = "../shared/types" }
solana-sdk = "2.3"
solana-client = "2.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tfhe = { version = "0.10", default-features = false, features = ["integer", "x86_64-unix"] }
rand = "0.8"
borsh = "1.5"
bincode = "1.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
blake2 = "0.10"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
