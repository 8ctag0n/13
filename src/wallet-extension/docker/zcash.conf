# ZyberLink Zcash Regtest Configuration

# Network
regtest=1
testnet=0

# RPC Configuration
server=1
rpcuser=zyberlink
rpcpassword=testpass123
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcport=18232

# Mining (generate blocks for testing)
gen=1
genproclimit=1
equihashsolver=tromp

# Sapling (shielded transactions)
experimentalfeatures=1
allowdeprecated=z_getnewaddress
allowdeprecated=z_getbalance
allowdeprecated=z_sendmany
allowdeprecated=z_listaddresses

# Wallet
keypool=10

# Logging
debug=rpc
debug=zrpc
