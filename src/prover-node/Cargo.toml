[package]
name = "zyberlink-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "prover_node"
path = "src/lib.rs"

[[bin]]
name = "zyberlink-prover"
path = "src/main.rs"

[[bin]]
name = "generate-fhe-keys"
path = "scripts/generate_fhe_keys.rs"

[dependencies]
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
clap = { version = "4.4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

solana-sdk.workspace = true
solana-client.workspace = true

zyberlink-sdk = { path = "../../sdks/rust" }
zyberlink-types = { path = "../shared/types" }

# Halo2 and Zcash Orchard dependencies
halo2_proofs = "0.3"
orchard = "0.8"
pasta_curves = "0.5"
blake2b_simd = "1.0"
ff = "0.13"
group = "0.13"
rand = "0.8"

# Encryption dependencies
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["reusable_secrets", "static_secrets"] }
borsh = "1.5"
zeroize = { version = "1.8", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["blocking", "json"] }
blake2 = "0.10"

# FHE (Fully Homomorphic Encryption) - using shared crate
zyberlink-fhe = { path = "../shared/fhe" }

# TUI dependencies
ratatui = "0.26"
crossterm = "0.27"

# Wizard dependencies
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
indicatif = "0.17"
dirs = "5.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
qr2term = "0.3"
urlencoding = "2.1"
url = "2.5"
