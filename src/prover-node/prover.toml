# pBTCFi E2E Test Configuration

[prover]
max_concurrent_jobs = 1
poll_interval_secs = 5
# Operation mode: "profit", "contributor", or "subsidize"
# - profit: Only accept jobs with ROI >= min_roi_threshold
# - contributor: Accept jobs that break even (ROI >= 0%)
# - subsidize: Accept all jobs regardless of profitability (for testing)
mode = "subsidize"
min_roi_threshold = 0.0
cost_multiplier = 1.0
mock_proving_time_secs = 2
zk_circuits_path = "./prover-circuits"
# FHE server key for real TFHE operations (generated via generate-fhe-keys)
fhe_server_key_path = "./fhe-keys/fhe_server_key.bin"

[witness]
base_url = "http://localhost:8080"
blink_backend_url = "http://localhost:8080"

[chains.solana]
type = "solana"
enabled = false  # Disabled - running in Starknet-only mode
rpc_url = "https://api.devnet.solana.com"
keypair_path = "~/.config/solana/id.json"
program_id = "11111111111111111111111111111111"

[chains.starknet]
type = "starknet"
enabled = true
rpc_url = "http://localhost:5050"
contract_address = "0x044ad1e679d1d26ed75b9d743a5063eb71dc11f788e21d7251c75d3655cefdeb"
prover_address = "0x064b48806902a367c8598f4f95c305e8c1a1acba5f082d294a43793113115691"

[chains.aptos]
type = "aptos"
enabled = true
rpc_url = "http://localhost:8080"
module_address = "0x8513a06eb9dcc92de56de2906c0b0ea4b99f92ac234411d2bf80c8f5bdb3fee5"
prover_address = "0x8513a06eb9dcc92de56de2906c0b0ea4b99f92ac234411d2bf80c8f5bdb3fee5"
