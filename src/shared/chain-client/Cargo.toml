[package]
name = "zyberlink-chain-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Async runtime
tokio.workspace = true
async-trait = "0.1"

# Serialization
serde.workspace = true
serde_json.workspace = true
borsh.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Solana (for SolanaClient implementation)
solana-sdk.workspace = true
solana-client.workspace = true
bincode = "1.3"

# Aptos (for AptosClient implementation - minimal primitives)
reqwest = { version = "0.11", features = ["json"], optional = true }
bcs = { version = "0.1", optional = true }
ed25519-dalek = { version = "2.1", optional = true }
sha3 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }

# UUID generation for mock
uuid = { version = "1.0", features = ["v4"] }

# Logging
log.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
solana = []
starknet = []
aptos = ["reqwest", "bcs", "ed25519-dalek", "sha3", "hex", "rand"]
