[package]
name = "zyberlink-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "prover_node"
path = "src/lib.rs"

[[bin]]
name = "zyberlink-prover"
path = "src/main.rs"

[[bin]]
name = "generate-fhe-keys"
path = "scripts/generate_fhe_keys.rs"

[[bin]]
name = "pbtcfi-prover"
path = "src/bin/pbtcfi_prover.rs"

[dependencies]
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"
clap = { version = "4.4", features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
bincode = "1.3"
hex = "0.4"
bcs = "0.1"
sha3 = "0.10"
tiny-keccak = "2"
toml = "0.8"

solana-sdk.workspace = true
solana-client.workspace = true
solana-program.workspace = true
solana-account-decoder.workspace = true

zyberlink-sdk = { path = "../../sdk/rust" }
zyberlink-unified-sdk = { path = "../../sdk/unified" }
futarchy-sdk = { package = "governance-sdk", path = "../../verticals/governance/sdk/rust" }
zyberlink-types = { path = "../../kernel/types" }
zyberlink-chain-client = { path = "../../packages/chain-client", features = ["aptos", "starknet"] }
bedrock-sdk = { path = "../../chain/solana/programs/sdks/bedrock-sdk" }
fhe-generator-sdk = { path = "../../chain/solana/programs/sdks/fhe-generator-sdk" }

# Halo2 and Zcash Orchard dependencies
halo2_proofs = "0.3"
orchard = "0.8"
pasta_curves = "0.5"
blake2b_simd = "1.0"
ff = "0.13"
group = "0.13"
rand = "0.8"

# Encryption dependencies
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["reusable_secrets", "static_secrets"] }
ed25519-dalek = "2.0"
borsh = "1.5"
zeroize = { version = "1.3", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["blocking", "json"] }
blake2 = "0.10"
base64 = "0.22"

# ECDSA signing for FHE results (Sprint 2/3)
# k256 for secp256k1 (legacy), starknet-crypto for STARK curve (native Cairo verification)
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
starknet-crypto = "0.8"

# FHE (Fully Homomorphic Encryption) - using shared crate
zyberlink-fhe = { path = "../../kernel/fhe" }

# Private Lending vertical (Aptos LTV verification)
private_lending = { path = "../../verticals/private_lending" }

# Futarchy FHE SDK for encrypted bet amounts (FheUint64)
fhe-client-sdk = { path = "../../sdk/fhe-client" }

# TUI dependencies
ratatui = "0.26"
crossterm = "0.27"

# Wizard dependencies
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
indicatif = "0.17"
dirs = "5.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
qr2term = "0.3"
urlencoding = "2.1"
url = "2.5"
