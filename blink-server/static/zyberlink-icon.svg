<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" />

  <!-- Z letter -->
  <path d="M 60 70 L 140 70 L 80 130 L 140 130 L 140 140 L 60 140 L 120 80 L 60 80 Z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="2"/>

  <!-- Link chain icon (simplified) -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="150" cy="150" r="8" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="55" y1="55" x2="145" y2="145" stroke="#ffffff" stroke-width="3"/>
</svg>
