# ZyberLink Development Stack - 3-Layer Architecture
# ==================================================
# Arquitectura de 3 capas:
#   public-api:3000 (expuesto) -> x402:8081 (interno) -> blink:8080 (interno)
#
# Uso:
#   podman-compose -f docker-compose.dev.yml up -d --build
#   podman-compose -f docker-compose.dev.yml logs -f
#   podman-compose -f docker-compose.dev.yml down

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: zyberlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zyberlink
      POSTGRES_USER: zyberlink
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyberlink -d zyberlink"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zyberlink-internal
    # Puerto interno, no expuesto al host en prod

  # ─────────────────────────────────────────────────────────────────────────
  # Layer 3: Blink Server (Internal Backend)
  # NO expuesto a internet - solo accesible via x402
  # ─────────────────────────────────────────────────────────────────────────
  blink:
    build:
      context: .
      dockerfile: services/blink-server/Dockerfile
    container_name: zyberlink-blink
    restart: unless-stopped
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://zyberlink:dev_password@postgres:5432/zyberlink
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://host.docker.internal:8899}
      PROGRAM_ID: ${PROGRAM_ID:-11111111111111111111111111111111}
      PORT: 8080
      HOST: 0.0.0.0
      X402_URL: http://x402:8081
    depends_on:
      postgres:
        condition: service_healthy
    # NO ports - solo accesible internamente
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - zyberlink-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────────────────────────────────────
  # Layer 2: X402 Anti-Spam Gateway
  # NO expuesto a internet - solo accesible via public-api
  # ─────────────────────────────────────────────────────────────────────────
  x402:
    build:
      context: .
      dockerfile: services/x402-server/Dockerfile
    container_name: zyberlink-x402
    restart: unless-stopped
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://zyberlink:dev_password@postgres:5432/zyberlink
      BLINK_URL: http://blink:8080
      PORT: 8081
      HOST: 0.0.0.0
    depends_on:
      blink:
        condition: service_healthy
    # NO ports - solo accesible internamente
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zyberlink-internal

  # ─────────────────────────────────────────────────────────────────────────
  # Layer 1: Public API Gateway (UNICO PUNTO DE ENTRADA)
  # Este es el UNICO servicio expuesto a internet
  # ─────────────────────────────────────────────────────────────────────────
  public-api:
    build:
      context: .
      dockerfile: services/public-api/Dockerfile
    container_name: zyberlink-public-api
    restart: unless-stopped
    environment:
      RUST_LOG: info
      X402_URL: http://x402:8081
      BLINK_URL: http://blink:8080
      PORT: 3000
      HOST: 0.0.0.0
      RATE_LIMIT_PER_MIN: 100
    depends_on:
      x402:
        condition: service_healthy
    # UNICO puerto expuesto al exterior
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zyberlink-internal

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend (opcional, para desarrollo)
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile.prod
    container_name: zyberlink-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      public-api:
        condition: service_healthy
    networks:
      - zyberlink-internal
    environment:
      - API_URL=http://public-api:3000
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-http://localhost:8899}
    profiles:
      - with-frontend

networks:
  zyberlink-internal:
    driver: bridge
    name: zyberlink-dev-net

volumes:
  postgres_data:
    name: zyberlink-dev-postgres
