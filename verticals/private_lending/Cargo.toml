[package]
name = "private_lending"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Private Lending vertical for Aptos with FHE-verified LTV"

[lib]
name = "private_lending"
path = "mod.rs"

[dependencies]
# Shared dependencies
zyberlink-types = { path = "../../kernel/types" }
zyberlink-fhe = { path = "../../kernel/fhe" }
zyberlink-chain-client = { path = "../../packages/chain-client", features = ["aptos"] }

# Async runtime
tokio = { version = "1.47", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging
log = "0.4"

# Hashing
sha3 = "0.10"

# Hex encoding
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros", "test-util"] }
