[package]
name = "futarchy-markets"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "futarchy_markets"

[features]
no-entrypoint = []
default = []
# Allow mock proofs for testing (bypasses Groth16 verification)
# NEVER enable in production builds!
mock-proofs = []

[dependencies]
solana-program.workspace = true
borsh.workspace = true
thiserror.workspace = true

# Groth16 verification (uses Solana BN254 syscalls)
groth16-solana = "0.2"

# Workspace dependencies for types and shared code
zyberlink-types = { path = "../../../../../kernel/types" }
zyberlink-jobs = { path = "../../../../../src/shared/jobs" }

# Core programs for CPI
bedrock = { path = "../../../../../chain/solana/bedrock", features = ["no-entrypoint"] }
zk-generator = { path = "../../../../../chain/solana/zk-generator", features = ["no-entrypoint"] }
fhe-generator = { path = "../../../../../chain/solana/fhe-generator", features = ["no-entrypoint"] }

[dev-dependencies]
# Integration tests
solana-program-test.workspace = true
solana-sdk.workspace = true
tokio = { version = "1", features = ["full"] }

# Unit tests (ultra fast)
mollusk-svm = "0.3"
bincode = "1.3"
