[workspace]
members = [
    "programs/bedrock",
    "programs/zk-generator",
    "programs/fhe-generator",
    "programs/threshold",
    "programs/futarchy-markets",
    "programs/e2e",
    "programs/sdks/bedrock-sdk",
    "programs/sdks/fhe-generator-sdk",
    "programs/sdks/zk-generator-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZyberLink Team"]

[workspace.dependencies]
# Kernel dependencies
zyberlink-types = { path = "../../kernel/types" }
zyberlink-crypto = { path = "../../kernel/crypto" }

# Shared libraries
zyberlink-jobs = { path = "../../packages/jobs" }

# Internal programs (for CPI)
bedrock = { path = "programs/bedrock", features = ["no-entrypoint"] }
zk-generator = { path = "programs/zk-generator", features = ["no-entrypoint"] }
fhe-generator = { path = "programs/fhe-generator", features = ["no-entrypoint"] }

# Solana
solana-program = "2.3"
borsh = { version = "1.5.7", features = ["derive"] }
thiserror = "1.0"

# Testing
solana-program-test = "2.3"
solana-sdk = "2.3"
solana-client = "2.3"
tokio = { version = "1.47", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.bpf]
inherits = "release"
