[package]
name = "futarchy-markets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "futarchy_markets"

[features]
no-entrypoint = []
default = []
# Allow mock proofs for testing (bypasses Groth16 verification)
# NEVER enable in production builds!
mock-proofs = []

[dependencies]
solana-program.workspace = true
borsh.workspace = true
thiserror.workspace = true

# Groth16 verification (uses Solana BN254 syscalls)
groth16-solana = "0.2"

# Workspace dependencies for types and shared code
zyberlink-types.workspace = true
zyberlink-jobs.workspace = true

# Core programs for CPI
bedrock.workspace = true
zk-generator.workspace = true
fhe-generator.workspace = true

[dev-dependencies]
# Integration tests
solana-program-test.workspace = true
solana-sdk.workspace = true
tokio.workspace = true

# Unit tests (ultra fast)
mollusk-svm = "0.3"
bincode = "1.3"
