# ZyberLink NGINX Load Balancer Configuration
# Production-ready with rate limiting and security

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # ===========================================
    # Basic Settings
    # ===========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version

    # ===========================================
    # Rate Limiting Zones
    # ===========================================
    # General requests: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # API requests: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Prover endpoints: 100 req/s per IP (for multi-prover setups)
    limit_req_zone $binary_remote_addr zone=provers:10m rate=100r/s;

    # Job creation: 2 req/s per IP (strict to prevent spam)
    limit_req_zone $binary_remote_addr zone=jobs_create:10m rate=2r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===========================================
    # Request Size Limits
    # ===========================================
    client_max_body_size 250M;         # Max upload size (FHE server keys ~120MB + base64 overhead)
    client_body_buffer_size 2M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ===========================================
    # Timeouts
    # ===========================================
    client_body_timeout 120s;          # FHE uploads can be large
    client_header_timeout 30s;
    send_timeout 120s;

    # ===========================================
    # Upstreams (Load Balancing)
    # ===========================================
    upstream webapp {
        least_conn;
        server webapp:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream backend {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ===========================================
    # Logging
    # ===========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'upstream=$upstream_addr uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ===========================================
    # Gzip Compression
    # ===========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # ===========================================
    # Security Headers (applied to all responses)
    # ===========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===========================================
    # Server Block
    # ===========================================
    server {
        listen 80;
        server_name _;

        # Connection limit
        limit_conn conn_limit 20;

        # Health check (no rate limit)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Metrics endpoint (internal only)
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ===========================================
        # API Routes
        # ===========================================

        # IDL endpoint - serves the program IDL as static JSON
        location = /api/idl {
            root /etc/nginx;
            try_files /idl.json =404;
            default_type application/json;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }

        # Server key pre-upload endpoint (~120MB binary)
        # This is the preferred method for uploading large TFHE server keys
        location = /api/server-key/upload {
            limit_req zone=jobs_create burst=5 nodelay;
            limit_req_status 429;

            # Large binary payload (raw server key, not base64)
            client_max_body_size 150M;

            # Disable client body buffering for streaming
            client_body_buffer_size 1M;
            client_body_timeout 1800s;  # 30 minutes for slow connections

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Very long timeouts for large uploads on slow connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;   # 30 minutes
            proxy_read_timeout 300s;    # 5 minutes for response
            proxy_request_buffering off;
        }

        # Server key existence check (fast, small response)
        location ~ ^/api/server-key/[^/]+/exists$ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Job validation - NOW smaller payload (uses server_key_hash instead of full key)
        location = /api/jobs/validate-and-build {
            limit_req zone=jobs_create burst=5 nodelay;
            limit_req_status 429;

            # Smaller payload now (encrypted_data + metadata, no full server_key)
            # Still allow 250M for legacy direct upload if needed
            client_max_body_size 250M;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Long timeouts for large uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # Job creation (POST only) - strict rate limit
        location = /api/jobs {
            limit_req zone=jobs_create burst=5 nodelay;
            limit_req_status 429;

            # Allow GET with higher limit for provers listing jobs
            if ($request_method = GET) {
                set $limit_zone provers;
            }

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Prover endpoints - high rate limit (witness, claim, etc)
        location ~ ^/api/jobs/[^/]+/(witness|claim|result) {
            limit_req zone=provers burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Prover registration/status
        location /api/provers {
            limit_req zone=provers burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Witness upload - large payload, special handling
        location /witness {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # FHE uploads are large and slow
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # FHE result upload - similar to witness
        location /fhe-result {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # General API - moderate rate limit
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # WebSocket support
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ===========================================
        # Frontend (SPA)
        # ===========================================
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://webapp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                proxy_pass http://webapp;
                proxy_cache_valid 200 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Block common attack patterns
        location ~* (\.php|\.asp|\.aspx|\.jsp|\.cgi)$ {
            return 444;
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
