events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream webapp_backend {
        server webapp:80;
    }

    upstream api_backend {
        server public-api:3000;
    }

    upstream blink_backend {
        server blink:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # API routes -> public-api
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Gateway prover routes -> public-api (witness download, proof submission)
        location /gateway/ {
            proxy_pass http://api_backend/gateway/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            client_max_body_size 200M;
        }

        # Witness upload -> blink internal API (large payloads - FHE server keys can be ~150MB+)
        location /witness {
            proxy_pass http://blink_backend/internal/witness;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 200M;
            proxy_read_timeout 600s;
        }

        # Frontend -> webapp
        location / {
            proxy_pass http://webapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
